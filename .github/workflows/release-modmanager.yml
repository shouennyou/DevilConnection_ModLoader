name: Release Mod Manager

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mod loader
        uses: actions/checkout@v7

      - name: Check out mod manager
        uses: actions/checkout@v7
        with:
          repository: shouennyou/DevilConnection_ModManager
          path: DevilConnection_ModManager

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('DevilConnection_ModManager/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install mod manager dependencies
        working-directory: DevilConnection_ModManager
        run: pnpm install --frozen-lockfile

      - name: Build mod manager
        working-directory: DevilConnection_ModManager
        run: pnpm run build

      - name: Add mod manager to app
        run: |
          mv DevilConnection_ModManager/dist app/ui

      - name: Package app
        run: >-
          pnpm dlx asar pack app app.asar
          --unpack "**/node_modules/steamworks.js/**/*.{node,dll,so,dylib}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: app.asar