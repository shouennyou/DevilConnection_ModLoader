name: Release Mod Manager

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Build Windows package
        required: false
        default: true
        type: boolean
      build_linux:
        description: Build Linux packages
        required: false
        default: false
        type: boolean
      build_macos:
        description: Build macOS package
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-modmanager
  cancel-in-progress: false

jobs:
  select-platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Create build matrix
        id: matrix
        env:
          BUILD_WINDOWS: ${{ inputs.build_windows }}
          BUILD_LINUX: ${{ inputs.build_linux }}
          BUILD_MACOS: ${{ inputs.build_macos }}
        run: |
          node -e '
            const fs = require("node:fs");
            const platforms = [
              [process.env.BUILD_WINDOWS === "true", { platform: "Windows", os: "windows-latest", command: "app:win", artifact: "modmanager-windows", files: "release/*.exe\nrelease/*.exe.blockmap\nrelease/latest.yml" }],
              [process.env.BUILD_LINUX === "true", { platform: "Linux", os: "ubuntu-latest", command: "app:linux", artifact: "modmanager-linux", files: "release/*.AppImage\nrelease/*.AppImage.blockmap\nrelease/*.deb\nrelease/latest-linux*.yml" }],
              [process.env.BUILD_MACOS === "true", { platform: "macOS", os: "macos-latest", command: "app:mac", artifact: "modmanager-macos", files: "release/*.dmg\nrelease/*.dmg.blockmap\nrelease/latest-mac.yml" }],
            ];
            const include = platforms.filter(([enabled]) => enabled).map(([, platform]) => platform);
            if (include.length === 0) throw new Error("Select at least one platform.");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          '

  prepare-ui:
    needs: select-platforms
    runs-on: ubuntu-latest
    steps:
      - name: Check out mod manager
        uses: actions/checkout@v7
        with:
          repository: shouennyou/DevilConnection_ModManager
          path: DevilConnection_ModManager

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: DevilConnection_ModManager/pnpm-lock.yaml

      - name: Install mod manager dependencies
        working-directory: DevilConnection_ModManager
        run: pnpm install --frozen-lockfile

      - name: Build mod manager
        working-directory: DevilConnection_ModManager
        run: pnpm run build

      - name: Upload mod manager UI
        uses: actions/upload-artifact@v5
        with:
          name: modmanager-ui
          path: DevilConnection_ModManager/dist
          if-no-files-found: error

  package:
    needs: [select-platforms, prepare-ui]
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}

    steps:
      - name: Check out mod loader
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Download mod manager UI
        uses: actions/download-artifact@v5
        with:
          name: modmanager-ui
          path: app/ui

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package app
        run: pnpm run ${{ matrix.command }} -- --publish never

      - name: Upload packages
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out mod loader
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Windows packages
        if: ${{ inputs.build_windows }}
        uses: actions/download-artifact@v5
        with:
          name: modmanager-windows
          path: release/windows

      - name: Download Linux packages
        if: ${{ inputs.build_linux }}
        uses: actions/download-artifact@v5
        with:
          name: modmanager-linux
          path: release/linux

      - name: Download macOS packages
        if: ${{ inputs.build_macos }}
        uses: actions/download-artifact@v5
        with:
          name: modmanager-macos
          path: release/macos

      - name: Publish Windows packages
        if: ${{ inputs.build_windows }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder publish --policy always --files release/windows/*

      - name: Publish Linux packages
        if: ${{ inputs.build_linux }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder publish --policy always --files release/linux/*

      - name: Publish macOS packages
        if: ${{ inputs.build_macos }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder publish --policy always --files release/macos/*
